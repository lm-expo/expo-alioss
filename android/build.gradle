apply plugin: 'com.android.library'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def supportsNamespace = project.android.hasProperty("namespace")
def supportsLintDsl = project.android.hasProperty("lint")

android {
    if (supportsNamespace) {
        namespace "com.reactnativealioss"
    }
    compileSdkVersion safeExtGet('Alioss_compileSdkVersion', 35)
    defaultConfig {
        minSdkVersion safeExtGet('Alioss_minSdkVersion', 21)
        targetSdkVersion safeExtGet('Alioss_targetSdkVersion', 35)
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    if (supportsLintDsl) {
        lint {
            disable += 'GradleCompatible'
        }
    } else {
        lintOptions {
            disable 'GradleCompatible'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    mavenLocal()
    google()
    mavenCentral()
}

dependencies {
    implementation "com.facebook.react:react-android"
    implementation 'com.aliyun.dpa:oss-android-sdk:+'
}
